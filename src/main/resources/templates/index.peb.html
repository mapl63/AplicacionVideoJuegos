{% extends "fragments/layout" %}

{% block body %}

    <div class="p-5 mb-4 rounded-4">
        <div class="d-flex flex-column align-items-center text-center">
            <h1 class="display-1 fw-bold">
                Gestión de VideoJuegos
            </h1>

            <p class="fs-4 text-danger">
                Una aplicación de ejemplo de Spring MVC con Pebble
            </p>

            {% if isAuthenticated %}
                <h1 class="display-4">
                    Saludos, {{ username | default('Usuario') }}
                </h1>
                <a class="btn btn-primary btn-lg" href="/videojuegos" role="button">
                    Ver VideoJuegos
                </a>
            {% else %}
                <h1 class="display-4">Saludos, visitante</h1>
                <a class="btn btn-primary btn-lg" href="/login" role="button">
                    Iniciar Sesión
                </a>
            {% endif %}
        </div>
    </div>

{% endblock %}
