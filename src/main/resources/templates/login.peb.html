{% extends "fragments/layout" %}

{% block body %}

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <!-- Login Form -->
        <div class="col-md-6 mt-5" id="loginbox">
            <div class="card shadow">
                <div class="card-header iniciar-sesion">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> {{ message('auth.login') }}</h4>
                </div>
                <div class="card-body bg-black bg-opacity-25">
                    <form action="/auth/login-post" id="loginform" method="POST">
                        <input name="{{ csrfParamName }}" type="hidden" value="{{ csrfToken }}">
                        <div class="mb-3">
                            <label class="form-label rounded-5 usuario-label" for="username">{{ message('auth.username') }}</label>
                            <div class="input-group">
                                <span class="input-group-text bg-black"><i class="bi bi-person text-info "></i></span>
                                <input class="form-control" id="login-username" name="username"
                                       placeholder="{{ message('auth.username') }}...."
                                       required type="text">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label contraseña-label" for="password">{{ message('auth.password') }}</label>
                            <div class="input-group">
                                <span class="input-group-text bg-black"><i class="bi bi-lock text-warning"></i></span>
                                <input class="form-control" id="login-password" name="password"
                                       placeholder="{{ message('auth.password') }}...."
                                       required type="password">
                            </div>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button class="btn btn-primary w-25" type="submit">{{ message('auth.login') }}</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
